name: Headless Ingest (15-min Telegram feed)

# Browser-free ingest: runs the RSS sweep + Telegram alerts on GitHub runners,
# so DMs flow with zero tabs open anywhere. Dedupe state persists via the
# SQLite file cached between runs — fresh runners are otherwise stateless and
# every run would resend the last 24h as "new". Overlapping runs are cancelled
# to protect the cached DB.
# First-ever run has no cache: expect up to TELEGRAM_MAX_ALERTS_PER_CYCLE + 1
# digest message (one-time catch-up, bounded by the cap).
# Requires repo Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (repo Settings -> Secrets and variables -> Actions -> New repository secret).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # on-demand run + proves the schedule works end to end

permissions:
  contents: read

concurrency:
  group: headless-ingest
  cancel-in-progress: true

jobs:
  ingest:
    name: RSS sweep + Telegram alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_MODE: per_article
      TELEGRAM_MAX_ALERTS_PER_CYCLE: "10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore dedupe DB cache
        uses: actions/cache@v4
        with:
          path: saved_stories/sunrisers_news.db
          key: srh-db-${{ github.run_id }}
          restore-keys: srh-db-

      - name: Flag missing Telegram secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID repo Secrets missing — ingest runs but sends no DMs."
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run headless ingest cycle
        run: python handy_tools/nightly_news_job.py
